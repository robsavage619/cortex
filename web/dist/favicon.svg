<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0b0d0f"/>

  <!-- Filled C ring: outer arc then line to inner arc, opening on right -->
  <!-- Outer r≈11, inner r≈6, center (14,16), opening ~±56° on right -->
  <path d="M 20 7 A 11 11 0 1 0 20 25 L 17 21 A 6 6 0 1 1 17 11 Z" fill="#06b6d4"/>

  <!-- Circuit traces: dark horizontal cuts through the left arc body -->
  <!-- with small bright nodes at endpoints, matching the logo's PCB style -->
  <line x1="3.5" y1="12" x2="10" y2="12" stroke="#0b0d0f" stroke-width="1.6"/>
  <line x1="2.5" y1="16" x2="8"  y2="16" stroke="#0b0d0f" stroke-width="1.6"/>
  <line x1="3.5" y1="20" x2="10" y2="20" stroke="#0b0d0f" stroke-width="1.6"/>

  <!-- Node dots at trace ends -->
  <circle cx="3.5"  cy="12" r="1.1" fill="#06b6d4"/>
  <circle cx="10"   cy="12" r="1.1" fill="#06b6d4"/>
  <circle cx="2.5"  cy="16" r="1.1" fill="#06b6d4"/>
  <circle cx="8"    cy="16" r="1.1" fill="#06b6d4"/>
  <circle cx="3.5"  cy="20" r="1.1" fill="#06b6d4"/>
  <circle cx="10"   cy="20" r="1.1" fill="#06b6d4"/>
</svg>
