# Railway/NIXPACKS build plan.
#
# This is a Python app (uv) that ALSO ships a React SPA which FastAPI serves from
# web/dist. NIXPACKS auto-detects only the Python provider (root pyproject.toml /
# uv.lock), so we extend its plan to build the frontend during deploy — the SPA
# is no longer committed.
#
# `"..."` extends the provider-generated arrays instead of replacing them, so the
# Python toolchain from the auto-detected plan is preserved.
#
# Node is NOT installed via nixpkgs — the pinned nixpkgs snapshot only has
# nodejs_22=22.10.0 and nodejs_24 doesn't exist in it. Vite 8 requires 22.12+,
# so we download the official Node 22.15.0 tarball directly in the build phase.

[phases.setup]
# Keep auto-detected Python packages; no Node from nixpkgs (see comment above).
nixPkgs = ["..."]

[phases.install]
# Override the auto-detected install to pin uv explicitly.
# $NIXPACKS_UV_VERSION is empty in Railway's nixpacks environment, so
# `pip install uv==$NIXPACKS_UV_VERSION` fails. Hardcode the version here instead.
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install uv==0.11.7 && uv sync --no-dev --frozen"
]

[phases.build]
dependsOn = ["install"]
# Single cmd so PATH export persists across the npm calls.
# npm install (not ci) so platform-specific rolldown linux bindings are resolved
# fresh on the build host rather than skipped due to the macOS-generated lockfile.
cmds = [
  "curl -fsSL https://nodejs.org/dist/v22.15.0/node-v22.15.0-linux-x64.tar.gz | tar -xz --strip-components=1 -C /usr/local && export PATH=/usr/local/bin:$PATH && npm --prefix web install && npm --prefix web run build"
]
