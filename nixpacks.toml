# Railway/NIXPACKS build plan.
#
# This is a Python app (uv) that ALSO ships a React SPA which FastAPI serves from
# web/dist. NIXPACKS auto-detects only the Python provider (root pyproject.toml /
# uv.lock), so we extend its plan to build the frontend during deploy — the SPA
# is no longer committed.
#
# `"..."` extends the provider-generated arrays instead of replacing them, so the
# Python toolchain from the auto-detected plan is preserved and Node is added.

[phases.setup]
# Add Node alongside the auto-detected Python packages.
nixPkgs = ["...", "nodejs_20"]

[phases.install]
# Override the auto-detected install to pin uv explicitly.
# $NIXPACKS_UV_VERSION is empty in Railway's nixpacks environment, so
# `pip install uv==$NIXPACKS_UV_VERSION` fails. Hardcode the version here instead.
cmds = [
  "python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install uv==0.11.7 && uv sync --no-dev --frozen"
]

[phases.build]
# Build the SPA after Python install. `npm ci` uses web/package-lock.json.
dependsOn = ["install"]
cmds = ["npm --prefix web ci", "npm --prefix web run build"]
